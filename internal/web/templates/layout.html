<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mac-cleaner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Banner -->
        <div class="text-center mb-8">
            <img src="/static/logo.webp" alt="Beavis and Butt-Head" class="mx-auto h-40 sm:h-52 rounded-xl shadow-lg shadow-slate-950/50 mb-4">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-yellow-500 tracking-tight">
                mac-cleaner
            </h1>
            <p class="text-yellow-500/80 text-sm mt-1 italic">"I need disk space for my bunghole!"</p>
        </div>

        <!-- Content block -->
        {{block "content" .}}{{end}}

        <!-- Footer -->
        <footer class="text-center text-slate-500 text-sm mt-10 pb-6 border-t border-slate-700 pt-4">
            Are you threatening my disk space?
        </footer>
    </div>
</body>
</html>
