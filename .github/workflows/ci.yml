name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  build:
    name: Build
    runs-on: macos-latest
    needs: [test, lint]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-s -w -X github.com/aviv4339/mac-cleaner/cmd.Version=${{ github.sha }} -X github.com/aviv4339/mac-cleaner/cmd.Commit=${{ github.sha }} -X github.com/aviv4339/mac-cleaner/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o mac-cleaner-darwin-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-cleaner-darwin-${{ matrix.goarch }}
          path: mac-cleaner-darwin-${{ matrix.goarch }}
